name: Validate Marketplace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude Code for CI
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json << 'SETTINGS'
          {
            "env": {
              "ANTHROPIC_API_KEY": "${{ secrets.OPENCODE_API_KEY }}",
              "ANTHROPIC_BASE_URL": "https://opencode.ai/zen/go",
              "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash",
              "ANTHROPIC_DEFAULT_SONNET_MODEL": "deepseek-v4-flash",
              "ANTHROPIC_DEFAULT_OPUS_MODEL": "deepseek-v4-flash",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
              "DISABLE_TELEMETRY": "true",
              "DISABLE_COST_WARNINGS": "true",
              "CLAUDE_CODE_USE_BEDROCK": "",
              "API_TIMEOUT_MS": "3000000"
            },
            "model": "deepseek-v4-flash"
          }
          SETTINGS
          echo '{"hasCompletedOnboarding": true}' > ~/.claude.json

      - name: Validate with Claude Code
        run: claude plugin validate . --strict

      - name: Verify plugin sources
        run: |
          set -euo pipefail

          # Hosts disagree on where a plugin keeps its manifest; take the first that exists.
          MANIFEST_PATHS=".claude-plugin/plugin.json .codex-plugin/plugin.json .grok-plugin/plugin.json .cursor-plugin/plugin.json .plugin/plugin.json"

          for MARKETPLACE in \
            .claude-plugin/marketplace.json \
            .agents/plugins/marketplace.json \
            .cursor-plugin/marketplace.json \
            .grok-plugin/marketplace.json \
            .github/plugin/marketplace.json; do

            echo "== $MARKETPLACE"

            # Fed by process substitution, not a pipe, so a failure exits the step
            # instead of only the subshell the loop would otherwise run in.
            while read -r plugin; do
              NAME=$(echo "$plugin" | jq -r '.name')
              # 'objects' keeps string sources from erroring out on an index
              SOURCE_TYPE=$(echo "$plugin" | jq -r '(.source | objects | .source) // empty')
              SOURCE_URL=$(echo "$plugin" | jq -r '(.source | objects | .url) // empty')
              PIN=$(echo "$plugin" | jq -r '(.source | objects | (.ref // .sha)) // empty')
              VERSION=$(echo "$plugin" | jq -r '.version // empty')

              # A string source is a path inside this repository, not a remote to verify
              [ "$SOURCE_TYPE" = "url" ] || continue
              echo "$SOURCE_URL" | grep -q "github.com" || continue

              REPO_PATH=$(echo "$SOURCE_URL" | sed 's|.*github.com/||; s|\.git$||')
              echo "  Verifying '$NAME' from $REPO_PATH..."

              if ! git ls-remote "https://github.com/${REPO_PATH}.git" HEAD >/dev/null 2>&1; then
                echo "  FAIL: repository $REPO_PATH not reachable"
                exit 1
              fi

              # GITHUB_TOKEN is repo-scoped; for public repos, unauthenticated works
              DEFAULT_BRANCH=$(curl -sf "https://api.github.com/repos/$REPO_PATH" | jq -r '.default_branch')
              if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" = "null" ]; then
                echo "  FAIL: could not determine default branch for $REPO_PATH"
                exit 1
              fi

              # Check what the entry actually resolves to, not just the default branch
              TARGET="${PIN:-$DEFAULT_BRANCH}"
              MANIFEST=""

              for P in $MANIFEST_PATHS; do
                if MANIFEST=$(curl -sf "https://raw.githubusercontent.com/${REPO_PATH}/${TARGET}/${P}"); then
                  echo "  ${P} at ${TARGET}: OK"
                  break
                fi
                MANIFEST=""
              done

              if [ -z "$MANIFEST" ]; then
                echo "  FAIL: no plugin manifest found at ${TARGET}"
                exit 1
              fi

              # An unpinned entry floats with the default branch, so its version is
              # display metadata and drifts by design. A pinned one must match.
              if [ -n "$PIN" ] && [ -n "$VERSION" ]; then
                UPSTREAM=$(echo "$MANIFEST" | jq -r '.version // empty')

                if [ "$UPSTREAM" != "$VERSION" ]; then
                  echo "  FAIL: entry declares $VERSION but ${TARGET} ships ${UPSTREAM:-no version}"
                  exit 1
                fi
                echo "  version $VERSION matches ${TARGET}: OK"
              fi
            done < <(jq -c '.plugins[]' "$MARKETPLACE")
          done
