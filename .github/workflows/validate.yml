name: Validate Marketplace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure Claude Code for CI
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json << 'SETTINGS'
          {
            "env": {
              "ANTHROPIC_API_KEY": "${{ secrets.OPENCODE_API_KEY }}",
              "ANTHROPIC_BASE_URL": "https://opencode.ai/zen/go",
              "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash",
              "ANTHROPIC_DEFAULT_SONNET_MODEL": "deepseek-v4-flash",
              "ANTHROPIC_DEFAULT_OPUS_MODEL": "deepseek-v4-flash",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
              "DISABLE_TELEMETRY": "true",
              "DISABLE_COST_WARNINGS": "true",
              "CLAUDE_CODE_USE_BEDROCK": "",
              "API_TIMEOUT_MS": "3000000"
            },
            "model": "deepseek-v4-flash"
          }
          SETTINGS
          echo '{"hasCompletedOnboarding": true}' > ~/.claude.json

      - name: Validate with Claude Code
        run: claude plugin validate . --strict

      - name: Verify plugin sources
        run: |
          MARKETPLACE=".claude-plugin/marketplace.json"
          PLUGINS=$(jq -c '.plugins[]' "$MARKETPLACE")

          echo "$PLUGINS" | while read -r plugin; do
            NAME=$(echo "$plugin" | jq -r '.name')
            SOURCE_TYPE=$(echo "$plugin" | jq -r '.source.source // empty')
            SOURCE_URL=$(echo "$plugin" | jq -r '.source.url // empty')
            SOURCE_REF=$(echo "$plugin" | jq -r '.source.ref // empty')
            VERSION=$(echo "$plugin" | jq -r '.version // empty')

            if [ "$SOURCE_TYPE" = "url" ] && echo "$SOURCE_URL" | grep -q "github.com"; then
              REPO_PATH=$(echo "$SOURCE_URL" | sed 's|.*github.com/||; s|\.git$||')
              echo "Verifying plugin '$NAME' from $REPO_PATH..."

              if ! git ls-remote "https://github.com/${REPO_PATH}.git" HEAD >/dev/null 2>&1; then
                echo "FAIL: Repository $REPO_PATH not reachable"
                exit 1
              fi
              echo "  Repo exists: OK"

              # GITHUB_TOKEN is repo-scoped; for public repos, unauthenticated works
              DEFAULT_BRANCH=$(curl -sf "https://api.github.com/repos/$REPO_PATH" | jq -r '.default_branch')

              if [ -z "$DEFAULT_BRANCH" ]; then
                echo "FAIL: Could not determine default branch for $REPO_PATH"
                exit 1
              fi
              echo "  Default branch: $DEFAULT_BRANCH"

              # Check what the entry actually resolves to, not just the default branch
              TARGET="${SOURCE_REF:-$DEFAULT_BRANCH}"

              if ! MANIFEST=$(curl -sf \
                "https://raw.githubusercontent.com/${REPO_PATH}/${TARGET}/.claude-plugin/plugin.json"); then
                echo "FAIL: plugin.json not found at ${TARGET}"
                exit 1
              fi
              echo "  plugin.json at ${TARGET}: OK"

              # An unpinned entry floats with the default branch, so its version is
              # display metadata and will drift by design. A pinned one must match.
              if [ -n "$SOURCE_REF" ] && [ -n "$VERSION" ]; then
                UPSTREAM=$(echo "$MANIFEST" | jq -r '.version // empty')

                if [ "$UPSTREAM" != "$VERSION" ]; then
                  echo "FAIL: entry declares $VERSION but ${TARGET} ships ${UPSTREAM:-no version}"
                  exit 1
                fi
                echo "  version $VERSION matches ${TARGET}: OK"
              fi
            fi
          done
